description: |
  Raspberry Pi RP1 MSI-X interrupt controller.

  The RP1 exposes one MSI-X vector per internal interrupt source. The
  vectors are routed through the BCM2712 MSI interrupt proxy to GIC
  SPIs. Zephyr keeps the RP1 sources in their own IRQ range, above the
  GIC SPI range; see
  <zephyr/dt-bindings/interrupt-controller/rp1-irq.h>.

  The driver locates the RP1 in the configuration space of the PCIe
  root complex that parents this node, programs the MSI-X table and
  unmasks the host side of the MSI proxy.

compatible: "raspberrypi,rp1-irq"

include: [interrupt-controller.yaml, base.yaml]

properties:
  reg:
    required: true
    description: |
      MSI-X CFG register block, i.e. the RP1 PCIe APBS window at
      offset 0x108000.

  msi-parent:
    type: phandle
    required: true
    description: MSI controller that receives the RP1 MSI-X writes.

interrupt-cells:
  - irq
  - flags
  - priority
